<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: aquamarine;
            width: 200px;
            height: 65px;
            border: 1px solid;
            overflow: visible;
        }
    </style>
</head>
<body>
    <h2>OverFlow</h2>

    <p>By default, the overflow is visible,
       meaning that it is not clipped and it
       renders outside the element's box:</p>

    <div>You can use the overflow property
        hen vou want to have better control of the layout.
        he overflow property specifies what happens
        if content overflows an element's box.</div>
</body>
</html>
