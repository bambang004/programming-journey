<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative;
            width: 300px;
            height: 300px;
            background-color: lightcyan;
        }
        .box1{
            position: absolute;
            top: 0;
            left: 0;
            background-color: red;
            width: 80px;
            height: 80px;
        }
        .box2{
            position: absolute;
            top: 0;
            right: 0;
            background-color: blue;
            width: 80px;
            height: 80px;
        }
        .box3{
            position: absolute;
            top: 0;
            right: 0;
            background-color: greenyellow;
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <h2>Absolute</h2>
    <div class="container">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
        <div class="box3">Box 3</div>
    </div>
</body>
</html>
