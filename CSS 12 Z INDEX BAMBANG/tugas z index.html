<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
        }
        h2{
            color: #333;
        }
        .container{
            position: relative;
            width: 400px;
            height: 300px;
            margin: 50px auto;
            border: 3px solid #007BFF;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

        }
        .Gambar{
            width: 200px;
            position: absolute;
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }
        .Gambar:hover{
            transform: scale(1.1);
        }
        .Gambar1{
            top: 20px;
            left: 100px;
            z-index: 3;
            border-color:blue;
        }
        .Gambar2{
            top: 60px;
            left: 70px;
            z-index: 2;
            border-color: red;
        }
        .Gambar3{
            top: 100px;
            width: 150px;
            left: 40px;
            z-index: 1;
            border-radius: 10px;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);


        }
    </style>
</head>
<body>
    <h2>Z- Index</h2>
    <div class="container">
        <img src="buah segar.webp" class="Gambar Buah segar">
        <img src="day and night.webp" class="Malam Yang dingin " alt="Gambar 2">
        <img src="alam.webp" alt="Gambar3" class="Gambar3">
        
    </div>
</body>
</html>
