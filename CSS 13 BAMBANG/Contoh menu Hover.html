<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .menu{
            background-color: rgb(68, 215, 245);
            overflow: hidden;
        }
        .menu a {
            float: left;
            display: block;
            color: black;
            text-align: center;
            padding: 16px 20px;
            text-decoration: none;
            transition: background-color 0.3s;
            
        }
        .menu a:hover{
            background-color: #f0d946;
            color: white;
        }
        h2{
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Contoh Menu Hover</h2>

    <div class="menu">
        <a href="#">Berada</a>
        <a href="#">Tentang</a>
        <a href="#">layanan</a>
        <a href="#">Kontak</a>
    </div>
</body>
</html>
