<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, tial-scale=1.0">
    <title>praktik bolder 1</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #e3f2fd;
        }

        h2 {
            text-align: center;
        }

        .solid {
            border: 3px solid blue;
            padding: 10px;
            background-color: #ca18b0;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 5px 5px rgb(0, 0, 0, 0.7);
        }

        .dotted {
            border: 3px dotted #1565c0;
            padding: 10px;
            background-color: #b3b309; 
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 5px 5px rgb(0, 0, 0, 0.7);
        }

        .double {
            border: 5px double #0d47a1;
            padding: 10px;
            background-color: #64b5f6;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 5px 5px rgb(0, 0, 0, 0.7);
        }

        .dashed {
            border: 3px dashed #0edaf5;
            padding: 10px;
            background-color: #31393a;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 5px 5px rgb(0, 0, 0, 0.7);
        }

        .groove {
            border: 5px groove #6a0f39;
            padding: 10px;
            background-color: #910c33;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 5px 5px rgb(0, 0, 0, 0.7);
        }

        .ridge {
            border: 5px ridge #4ee95b;
            padding: 10px;
            background-color: #165404;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 5px 5px rgb(0, 0, 0, 0.5);
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9em;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <h2>Border</h2>

    <p class="solid"> border solid</p>
    <p class="dotted"> border dotted</p>
    <p class="double"> border double</p>

    <p class="dashed"> border dashed</p>
    <p class="groove"> border groove</p>
    <p class="ridge"> border ridge</p>

    <footer>
        <p>BAMBANG SETYO AJI &copy; X PPLG</p>
    </footer>

</body>
</html>
