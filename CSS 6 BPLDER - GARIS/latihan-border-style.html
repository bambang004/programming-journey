<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mengubah jenis garis</title>
    <style>
        body {
            margin: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .solid {
            width: 550px;
            height: 100px;
            border: 3px solid black;
            padding: 10px;
            margin: 0 auto;
            text-align: center;
            font-weight: bold;
            border-radius: 12px;
            background-color: white;
            box-shadow: 5px 5px rgba(249, 180, 180, 0.7);
        }

        .deshead {
            width: 550px;
            height: 100px;
            border: 3px dashed red;
            padding: 10px;
            margin: 0 auto;
            text-align: center;
            font-weight: bold;
            border-radius: 12px;
            background-color: white;
            box-shadow: 5px 5px rgba(245, 140, 140, 0.7);
        }

        .detted {
            width: 550px;
            height: 100px;
            border: 3px dotted blue;
            padding: 10px;
            margin: 0 auto;
            text-align: center;
            font-weight: bold;
           
            background-color: white;
            box-shadow: 5px 5px rgba(222, 131, 131, 0.7);
        }

        .double {
            width: 550px;
            height: 100px;
            border: 3px double rgb(97, 101, 97);
            padding: 10px;
            margin: 0 auto;
            text-align: center;
            font-weight: bold;
            
            background-color: white;
            box-shadow: 5px 5px rgba(239, 149, 149, 0.7);
        }

        .groove {
            width: 550px;
            height: 100px;
            border: 3px groove purple;
            padding: 10px;
            margin: 0 auto;
            text-align: center;
            font-weight: bold;
           
            background-color: white;
            box-shadow: 5px 5px rgb(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="solid">garis solid</div>
    <div class="deshead">garis dashead</div>
    <div class="detted">garis detted</div>
    <div class="double">garis double</div>
    <div class="groove">garis groove</div>
</body>
</html>
