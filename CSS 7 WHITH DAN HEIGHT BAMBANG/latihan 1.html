<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan 1</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #e3f2fd;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .box1 {
            width: 200px;
            height: 100px;
            background-color: #fa4327;
            margin-bottom: 20px;
            color: white;
            padding: 5px;
            text-align: center;
            margin: auto;
            margin-top: 12px;
            margin-bottom: 12px;
            border-radius: 15px;
            box-shadow: 5px 5px rgb(0, 0, 0,0.7);
        }

        .box2 {
            width: 50%;
            height: 100px;
            background-color: #ad2105;
            margin-bottom: 20px;
            color: white;
            padding: 10px;
            text-align: center;
            margin: auto;
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 5px 5px rgb(0, 0, 0,0.7);
        }

        .box3 {
            width: 60vw;
            height: 20vh;
            background-color: #7a1e05;
            color: white;
            padding: 10px;
            text-align: center;
            margin: auto;
            margin-top: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 5px 5px rgb(0, 0, 0,0.7);
        }
    </style>
</head>
<body>
    <h2>Tiga Ukuran Box</h2>

    <div class="box1">Box 1 (200px x 100px)</div>
    <div class="box2">Box 2 (50% x 100px)</div>
    <div class="box3">Box 3 (60vw x 20vh)</div>
</body>
</html>
