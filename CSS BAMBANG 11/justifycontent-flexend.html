<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 600px;
            border:5px solid rgb(121, 212, 235);
            margin: 30px;
            padding: 5px;
            display: flex;
            justify-content: flex-end;
        }
        .container div{
            width: 100px;
            height: 100px;
            background-color: rgb(134, 235, 203);
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="satu">1</div>
        <div class="dua">2</div>
        <div class="tiga">3</div>
</body>
</html>
